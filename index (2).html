<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<title>My Vault</title>
<style>
:root{--bg:#0e0e12;--txt:#eef0ff;--muted:#a2a2b5;--line:rgba(255,255,255,.09);--glass:rgba(78,78,97,.2);--glass2:rgba(78,78,97,.42);--a1:#ad7bff;--a2:#00fad9;--a3:#ff7966;--ok:#00fad9;--warn:#ffb199;--bad:#ff7966;--r:20px;--grad:linear-gradient(135deg,#ff8a75,#ff5f4a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- ambient background ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,#1d1b2e 0%,#0e0e12 65%)}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.42;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#ff7966;left:-24vmax;top:-26vmax}
.aurora i:nth-child(2){background:#00d9c0;right:-30vmax;top:14vh;animation-duration:28s;animation-delay:-6s;opacity:.3}
.aurora i:nth-child(3){background:#ad7bff;left:-14vmax;bottom:-34vmax;animation-duration:32s;animation-delay:-10s;opacity:.26}
@keyframes drift{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(8vmax,6vmax) scale(1.12) rotate(50deg)}100%{transform:translate(-6vmax,10vmax) scale(.96) rotate(110deg)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 20px 30px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 90px 120px,rgba(190,240,255,.7),transparent),radial-gradient(1.2px 1.2px at 160px 60px,rgba(255,220,240,.7),transparent);background-size:220px 200px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:.6}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top),var(--safe-area-inset-top,0px)) 16px 130px}
html.native #app{padding-top:max(26px,env(safe-area-inset-top),var(--safe-area-inset-top,0px))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 8px 26px -8px rgba(255,121,102,.9),inset 0 1px 0 rgba(255,255,255,.35);flex:none}
.hello{color:var(--muted);font-size:12.5px;letter-spacing:.2px}
.brand{font-size:21px;font-weight:750;letter-spacing:-.4px;line-height:1.15}
.brand.big{font-size:34px;text-align:center}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .18s,background .2s}
.icon-btn:active{transform:scale(.9);background:var(--glass2)}
.icon-btn.sm{width:36px;height:36px;border-radius:12px}
.muted{color:var(--muted)}.sm{font-size:13px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.sec-head h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.sub-head{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:20px 4px 10px;font-weight:600}
.view{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- cards ---------- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 40px -22px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.card.tap{cursor:pointer;transition:transform .18s}
.card.tap:active{transform:scale(.985)}
.hero{background:linear-gradient(145deg,rgba(255,121,102,.34),rgba(255,121,102,.12) 60%,rgba(224,80,158,.14));border-color:rgba(173,123,255,.35)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 80% at 100% 0%,rgba(0,250,217,.18),transparent 70%);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px;flex-wrap:wrap;margin-top:14px}
.title{font-size:17px;font-weight:650;letter-spacing:-.2px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:780;letter-spacing:-1px;line-height:1.1;margin-top:6px;background:linear-gradient(90deg,#fff,#cfc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);position:relative;z-index:1}
.stats3 b{display:block;font-size:14px;margin-top:4px;font-weight:650}
.ring{flex:none;filter:drop-shadow(0 0 12px rgba(255,121,102,.5))}
.ring .arc{transition:stroke-dashoffset 1.4s cubic-bezier(.3,.9,.3,1)}
.ring text{fill:#fff;font-weight:750;font-size:21px;font-family:inherit}
.amt-row{display:flex;justify-content:space-between;margin:14px 0 10px}
.amt-row .r{text-align:right}
.amt{font-size:22px;font-weight:750;letter-spacing:-.4px;margin-top:3px}.ok{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a3));background-size:200% 100%;transition:width 1.3s cubic-bezier(.3,.9,.3,1);position:relative;animation:flow2 4s linear infinite}
.bar b::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes flow2{to{background-position:200% 0}}
@keyframes shine{to{transform:translateX(100%)}}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#d6d9f5}
.badge{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(173,123,255,.2);border:1px solid rgba(173,123,255,.5);color:#d4ceff;white-space:nowrap}
.badge.ok{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.5);color:var(--ok)}
.badge.warn{background:rgba(255,200,87,.14);border-color:rgba(255,200,87,.5);color:var(--warn)}
.badge.bad{background:rgba(255,107,129,.14);border-color:rgba(255,107,129,.5);color:var(--bad)}
.card.done{opacity:.82}
.chip-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgba(173,123,255,.28),rgba(0,250,217,.14));border:1px solid rgba(173,123,255,.38);color:#d0caff}
.chip-ic.sm{width:36px;height:36px;border-radius:12px}
.chip-ic.ok{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.4);color:var(--ok)}
.chip-ic.warn{background:rgba(255,200,87,.14);border-color:rgba(255,200,87,.4);color:var(--warn)}
.chip-ic.pink{background:rgba(255,107,129,.14);border-color:rgba(255,107,129,.4);color:#ff9bb0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:14px;font-weight:650;font-size:14.5px;background:var(--glass2);border:1px solid var(--line);transition:transform .15s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px}
.btn.primary{border:0;background:var(--grad);color:#fff;box-shadow:0 10px 26px -10px rgba(255,121,102,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.45);color:var(--bad)}
.btn.wide{width:100%;margin-top:6px}
.btn[disabled]{opacity:.55}
.mini{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);flex:none;color:#cfd2f0}
.mini:active{transform:scale(.86)}.mini.bad{color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;color:#c9cdee;transition:all .2s}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(255,121,102,.8)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}
.search input{border:0;background:transparent;padding:13px 0;box-shadow:none!important}

/* ---------- home ---------- */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:#d9dcf7;transition:transform .18s;animation:rise .6s both;animation-delay:calc(var(--i,0)*60ms)}
.act:active{transform:scale(.93)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile-s{padding:14px 10px;border-radius:18px;background:var(--glass);border:1px solid var(--line);animation:rise .6s both;animation-delay:calc(var(--i,0)*60ms);transition:transform .18s}
.tile-s:active{transform:scale(.95)}
.tile-s b{display:block;font-size:24px;margin-top:10px;font-weight:750;letter-spacing:-.5px}
.tile-s .t{font-size:12px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.chk:first-of-type{border-top:0}
.chk .v{margin-left:auto;font-weight:650;font-size:13px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;margin-bottom:10px;background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.3)}
.alert.bad{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.35)}
.chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:140px;margin-top:14px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .val{font-size:10.5px;color:var(--muted);height:14px}
.chart .barv{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .barv i{display:block;width:70%;max-width:34px;min-height:4px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--a2),var(--a1));transition:height 1.1s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 18px -4px rgba(0,250,217,.6)}
.chart .col span{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .eic{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(173,123,255,.25),rgba(0,250,217,.12));border:1px solid rgba(173,123,255,.35);color:#cfc9ff;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.empty h3{color:var(--txt);margin-bottom:6px;font-size:17px}

/* ---------- photos ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;animation:rise .5s both;animation-delay:calc(var(--i,0)*30ms);transition:transform .18s}
.tile:active{transform:scale(.94)}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.tile img.loaded{opacity:1}
.tile.locked{display:flex;align-items:center;justify-content:center;color:#d0caff;background:linear-gradient(135deg,rgba(255,121,102,.32),rgba(224,80,158,.24))}
.tile.locked::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2),transparent 70%);transform:translateX(-100%);animation:shine 2.8s infinite}
.pv{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:24px;height:24px;background:rgba(14,14,18,.7);border-radius:8px;color:#fff}

/* ---------- vault items ---------- */
.seg{display:flex;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:12px;font-weight:650;font-size:14px;color:var(--muted);transition:all .25s}
.seg button.on{color:#fff;background:var(--grad);box-shadow:0 8px 20px -8px rgba(255,121,102,.8)}
.secr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.secr .sl{font-size:12px;color:var(--muted);width:90px;flex:none}
.secr .sv{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all}
.kv{display:flex;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv .sl{font-size:12px;color:var(--muted);width:90px;flex:none;padding-top:1px}
.kv .sv{flex:1;word-break:break-word}

/* ---------- bottom nav ---------- */
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px));width:min(94vw,500px);display:flex;padding:6px;border-radius:24px;background:rgba(28,28,35,.94);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 50px -14px rgba(0,0,0,.85)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:18px;font-size:10.5px;font-weight:600;color:var(--muted);transition:all .3s}
.nav button .ic{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.nav button.on{color:#fff;background:linear-gradient(135deg,rgba(255,121,102,.55),rgba(255,121,102,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 24px -6px rgba(255,121,102,.9)}
.nav button.on .ic{transform:translateY(-2px) scale(1.12)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.modal.open{opacity:1}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1f1f28,#14141b);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.modal.open .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.22);margin:4px auto 12px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-head h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:11.5px;color:var(--muted);margin:0 0 6px 3px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600}
input,select,textarea{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(0,250,217,.18)}
option{color:#111}
input[type=file]{padding:10px}
.pwrow{display:flex;gap:8px;align-items:center}
.meter{height:4px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:9px;transition:width .3s,background .3s;background:var(--bad)}
.meter[data-s="2"] i{background:var(--warn)}.meter[data-s="3"] i{background:#9be15d}.meter[data-s="4"] i{background:var(--ok)}
.list .li{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.atts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.att{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11.5px;text-align:center;padding:8px;word-break:break-all;cursor:pointer;color:#cfd2f0}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}.att img.loaded{opacity:1}
.att .x{position:absolute;top:5px;right:5px;z-index:2;background:rgba(14,14,18,.75);border-radius:9px;width:26px;height:26px;display:grid;place-items:center}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .st{flex:1;min-width:0}.srow .st b{display:block;font-size:14.5px;font-weight:650}.srow .st span{font-size:12.5px;color:var(--muted)}
.group{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:4px 14px;margin-bottom:14px}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.95);display:flex;flex-direction:column;animation:fadein .25s}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top),var(--safe-area-inset-top,0px)) 14px 8px}
.viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;gap:6px}
.viewer img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 24px 70px -12px rgba(255,121,102,.5);animation:rise .5s both}
.viewer .vf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 14px calc(18px + env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px))}

/* ---------- lock screen ---------- */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px 0}
.lock p{max-width:320px}
.orb{width:128px;height:128px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#ff7966,#ff5f4a,#ad7bff,#ffc857,#ff7966);animation:spin 6s linear infinite;box-shadow:0 0 60px rgba(255,121,102,.55),0 0 120px rgba(255,121,102,.25);margin-bottom:10px}
.orb-in{width:100%;height:100%;border-radius:50%;background:#14141b;display:grid;place-items:center;color:#d6d0ff;animation:unspin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}
.lock-form{width:min(86vw,340px);display:flex;flex-direction:column;gap:10px;margin-top:8px}
.lock-form input{text-align:center;font-size:16px;padding:15px}
.err{color:var(--bad);min-height:20px;font-size:13.5px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.check{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:13px;color:var(--muted)}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.fp{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 14px 40px -10px rgba(255,121,102,.9);margin:6px 0 4px;transition:transform .2s}
.fp:active{transform:scale(.92)}
.fp .pr{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,250,217,.7);animation:pulse 2.4s ease-out infinite}
.fp .pr.p2{animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}

/* ---------- Trackizer-style theme ---------- */
.aurora{background:radial-gradient(120% 60% at 50% -10%,#221f33 0%,#0e0e12 62%)}

.badge.ok{background:rgba(0,250,217,.12);border-color:rgba(0,250,217,.45);color:var(--ok)}

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const kvGet=k=>new Promise((res,rej)=>{const q=DB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const kvSet=(k,v)=>new Promise((res,rej)=>{const t=DB.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
const kvDel=k=>new Promise((res,rej)=>{const t=DB.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
const kvClear=()=>new Promise((res,rej)=>{const t=DB.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});

/* ---------- encrypted files ---------- */
async function putFile(blob){const id=uid();const buf=await blob.arrayBuffer();await kvSet('f:'+id,{mime:blob.type||'application/octet-stream',buf:await encBuf(KEY,buf)});return id}
async function fileURL(id){
  if(urlCache.has(id))return urlCache.get(id);
  const r=await kvGet('f:'+id);if(!r||!KEY)return null;
  const buf=await decBuf(KEY,r.buf);const u=URL.createObjectURL(new Blob([buf],{type:r.mime}));urlCache.set(id,u);return u;
}
async function delFile(id){await kvDel('f:'+id);const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}}
function hydrate(root=document){
  $$('img[data-fid]',root).forEach(async el=>{
    try{const u=await fileURL(el.dataset.fid);if(!u||!el.isConnected)return;el.onload=()=>el.classList.add('loaded');el.src=u}catch(e){}
  });
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function shrink(file,max,q){
  const {im,u}=await loadImg(file);const sc=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
async function storeUpload(file,max){
  let blob=file;
  if(file.type.startsWith('image/')){try{blob=await shrink(file,max||2000,.88)}catch(e){}}
  const id=await putFile(blob);return{fileId:id,name:file.name||'file',mime:blob.type||file.type||''};
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const safeName=n=>String(n||'file').replace(/[^\w.\- ]/g,'_');
async function outBlob(blob,name){
  name=safeName(name);
  if(NATIVE&&FS&&ShareP){
    try{
      noLockUntil=Date.now()+300000;
      const r=await FS.writeFile({path:name,data:await blobToB64(blob),directory:'CACHE'});
      await ShareP.share({title:name,url:r.uri,dialogTitle:'Save or share'});
    }catch(e){const m=String((e&&e.message)||e).toLowerCase();if(!m.includes('cancel'))toast('Could not share: '+((e&&e.message)||e))}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function saveFile(fileId,name){const url=await fileURL(fileId);if(!url)return toast('File not found');await outBlob(await (await fetch(url)).blob(),name)}

async function bioUnlock(){
  if(!(Bio&&bioOn))return;
  const err=$('#err');

/* ---------- helpers ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2900)}
function greet(){const h=new Date().getHours();return h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function countUp(el,to){const t0=performance.now(),d=1000;const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(Math.round(to*e)):fmt(to);if(p<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)}
function ring(pct,size){
  const id='rg'+(++rid),r=size/2-9,c=2*Math.PI*r,to=c*(1-Math.max(0,Math.min(100,pct))/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7966"/><stop offset=".55" stop-color="#ffa699"/><stop offset="1" stop-color="#ad7bff"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/><circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-to="${to}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">${Math.round(pct)}%</text></svg>`;
}
function gauge(pct,w){
  const id='gg'+(++rid),R=w*0.42,cx=w/2,cy=R+14,len=Math.PI*R,to=len*(1-Math.max(0,Math.min(100,pct))/100),d=`M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy}`;
  return `<svg class="ring gauge" width="${w}" height="${cy+8}" viewBox="0 0 ${w} ${cy+8}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7966"/><stop offset=".6" stop-color="#ffa699"/><stop offset="1" stop-color="#ad7bff"/></linearGradient></defs><path d="${d}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8" stroke-linecap="round"/><path class="arc" d="${d}" fill="none" stroke="url(#${id})" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-to="${to}"/></svg>`;
}
const logo=(s,spin)=>spin?`<div class="orb"><div class="orb-in">${ic('vault',52)}</div></div>`:`<div class="logo" style="width:${s}px;height:${s}px">${ic('vault',Math.round(s*.58))}</div>`;
const empty=(i,h,p)=>`<div class="empty card"><div class="eic">${ic(i,30)}</div><h3>${h}</h3><p>${p}</p></div>`;

const remOf=d=>Math.max(0,Number(d.total||0)-paidOf(d));
function expStatus(exp){
  if(!exp)return null;
  const days=Math.ceil((new Date(exp+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);
  if(days<0)return{level:'bad',text:'Expired '+(-days)+'d ago',days};
  if(days<=90)return{level:'warn',text:'Expires in '+days+'d',days};
  return{level:'ok',text:'Valid until '+fdate(exp),days};
}
const last4=s=>{s=String(s||'');return s?'•••• '+s.slice(-4):'—'};
function strength(v){if(!v)return 0;let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v)&&/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;return Math.max(1,s)}
function pwHealth(){
  const items=[...S.emails.map(e=>({p:e.password,mail:1})),...S.banks.filter(b=>b.password).map(b=>({p:b.password}))].filter(x=>x.p);
  const cnt={};items.forEach(x=>cnt[x.p]=(cnt[x.p]||0)+1);
  let weak=0,reuse=0;items.forEach(x=>{if(x.mail&&x.p.length<10)weak++;if(cnt[x.p]>1)reuse++});
  return{total:items.length,weak,reuse};
}

document.addEventListener('change',async e=>{
  const t=e.target;if(!t.matches||!t.matches('input[data-kind=photos]'))return;
  const files=[...t.files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  let n=0;
  for(const f of files){
    n++;toast('Encrypting photo '+n+' of '+files.length+'…');
    try{
      const main=await shrink(f,2200,.88),thumb=await shrink(f,420,.8);
      S.photos.unshift({id:uid(),fileId:await putFile(main),thumbId:await putFile(thumb),private:false,added:todayStr(),name:f.name});
    }catch(err){toast('Could not add '+f.name)}
  }
  t.value='';await save();renderApp();toast('Photos added');
});

};
forms.settings=async fd=>{S.settings.currency=(fd.currency||'RM').trim()||'RM';S.settings.autolock=parseInt(fd.autolock,10)||3;const o=BG_OPTS.find(x=>x[0]===fd.bglock);S.settings.bglock=o?o[1]:30;await save();closeModal();poke();renderApp();toast('Preferences saved')};
acts.bioon=()=>openModal('Turn on fingerprint',shell('bioon',null,`<p class="muted sm" style="margin-bottom:12px">Enter your passcode once. It is then kept in the phone's secure keystore and released only after your fingerprint.</p><label class="f"><span>Passcode</span><input type="password" name="p" required autocomplete="current-password"></label>`,'Continue'));
forms.bioon=async(fd,f)=>{
  const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Checking…';
  try{
    if(!(await verifyPass(fd.p)))throw new Error('Wrong passcode');
    await bioPrompt('Confirm your fingerprint to turn this on');
    await Bio.setCredentials({username:'vault',password:fd.p,server:BIO_SERVER});
    await kvSet('bio',true);bioOn=true;closeModal();renderApp();toast('Fingerprint unlock is on');
  }catch(e){toast(e&&e.message?e.message:'Could not turn on fingerprint');btn.disabled=false;btn.textContent='Continue'}
};
acts.biooff=async()=>{try{await Bio.deleteCredentials({server:BIO_SERVER})}catch(e){}await kvSet('bio',false);bioOn=false;closeModal();renderApp();toast('Fingerprint unlock is off')};
acts.chpass=()=>openModal('Change passcode',shell('chpass',null,fld('Current passcode','o',{type:'password',req:1})+fld('New passcode','n1',{type:'password',req:1,min:6})+fld('Repeat new passcode','n2',{type:'password',req:1,min:6}),'Change passcode'));
forms.chpass=async(fd,f)=>{
  const btn=f.querySelector('[type=submit]');
  if(fd.n1!==fd.n2)return toast('New passcodes do not match');
  btn.disabled=true;btn.textContent='Updating…';
  try{
    const meta=await kvGet('meta');if(!meta.wrapped)throw new Error('This older vault cannot change passcode');
    let raw;try{raw=await decBuf(await deriveKey(fd.o,meta.salt),meta.wrapped)}catch(e){throw new Error('Current passcode is wrong')}
    const salt=crypto.getRandomValues(new Uint8Array(16));
    await kvSet('meta',{v:2,salt,wrapped:await encBuf(await deriveKey(fd.n1,salt),raw)});
    if(bioOn&&Bio){try{await Bio.setCredentials({username:'vault',password:fd.n1,server:BIO_SERVER})}catch(e){bioOn=false;await kvSet('bio',false)}}
    closeModal();toast('Passcode changed');
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Change passcode'}
};
const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
function pack(v){
  if(v instanceof ArrayBuffer)return{__b64:toB64(v),t:'ab'};
  if(v instanceof Uint8Array)return{__b64:toB64(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength)),t:'u8'};
  if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=pack(v[k]);return o}
  return v;
}
function unpack(v){
  if(v&&typeof v==='object'){if(v.__b64!==undefined){const b=fromB64(v.__b64);return v.t==='u8'?new Uint8Array(b):b}const o={};for(const k in v)o[k]=unpack(v[k]);return o}
  return v;
}
acts.export=async()=>{
  toast('Preparing backup…');
  const items={};
  await new Promise((res,rej)=>{const rq=DB.transaction('kv').objectStore('kv').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){if(c.key!=='bio')items[c.key]=pack(c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)});
  const blob=new Blob([JSON.stringify({app:'my-vault',v:1,items})],{type:'application/json'});
  await outBlob(blob,'my-vault-backup-'+todayStr()+'.json');
};
document.addEventListener('change',async e=>{
  const t=e.target;if(!t.matches||!t.matches('input[data-kind=import]'))return;
  const file=t.files[0];if(!file)return;
  try{
    const j=JSON.parse(await file.text());if(j.app!=='my-vault'||!j.items||!j.items.meta)throw new Error('Not a vault backup');
    if(!confirm('Replace everything in this vault with the backup? You will unlock it with the backup passcode.'))return;
    await kvClear();for(const k in j.items)await kvSet(k,unpack(j.items[k]));
    if(bioOn&&Bio){try{await Bio.deleteCredentials({server:BIO_SERVER})}catch(err){}}
    bioOn=false;lock();toast('Backup restored. Unlock with its passcode.');
  }catch(err){toast('Import failed: '+err.message)}
});
acts.erase=()=>openModal('Erase everything',shell('erase',null,`<p class="muted sm" style="margin-bottom:12px">This permanently deletes all debts, documents, photos and logins on this device. Type <b>ERASE</b> to confirm.</p><input name="w" required autocomplete="off">`,'Erase forever'));
forms.erase=async fd=>{
  if((fd.w||'').trim()!=='ERASE')return toast('Type ERASE exactly');
  await kvClear();if(Bio){try{await Bio.deleteCredentials({server:BIO_SERVER})}catch(e){}}
  bioOn=false;lock(true);toast('Vault erased');
};

/* ---------- lock / unlock / boot ---------- */
function lock(fresh){
  KEY=null;S=null;photosUnlocked=false;clearTimeout(idleTimer);
  urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear();closeModal(true);closeViewer();
  tab='home';
  kvGet('meta').then(m=>m&&!fresh?renderUnlock():renderSetup());
}
function poke(){clearTimeout(idleTimer);if(KEY)idleTimer=setTimeout(()=>lock(),((S&&S.settings.autolock)||3)*60000)}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>addEventListener(ev,poke,{passive:true,capture:true}));
document.addEventListener('click',e=>{if(e.target&&e.target.type==='file')noLockUntil=Date.now()+300000},true);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(!KEY||!hiddenAt||Date.now()<noLockUntil)return;
  const bg=(S&&S.settings&&S.settings.bglock!=null)?S.settings.bglock:30;
  if(Date.now()-hiddenAt>=bg*1000)lock();
});
async function tryUnlock(pass){
  try{
    const meta=await kvGet('meta');KEY=await openKey(pass,meta);
    const d=await kvGet('data');
    S=Object.assign(defaults(),d?JSON.parse(dec.decode(await decBuf(KEY,d))):{});
    S.settings=Object.assign(defaults().settings,S.settings||{});
    enter();return true;
  }catch(e){KEY=null;S=null;return false}
}
forms.setup=async(fd,f)=>{
  const err=$('#err');
  if(fd.p1!==fd.p2){err.textContent='Passcodes do not match';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Securing…';
  const salt=crypto.getRandomValues(new Uint8Array(16)),raw=crypto.getRandomValues(new Uint8Array(32));
  const kek=await deriveKey(fd.p1,salt);
  await kvSet('meta',{v:2,salt,wrapped:await encBuf(kek,raw)});
  KEY=await importDEK(raw);S=defaults();await save();enter();
};
forms.unlock=async(fd,f)=>{
  const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Unlocking…';
  if(!(await tryUnlock(fd.p))){
    $('#err').textContent='Wrong passcode. Try again.';btn.disabled=false;btn.textContent='Unlock';
    f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');const i=f.querySelector('input');i.value='';i.focus();
  }
};
function enter(){tab='home';poke();renderApp()}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=acts[a.dataset.act];if(fn){if(a.tagName==='BUTTON')e.preventDefault();fn(a,e)}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const h=forms[f.dataset.form];if(!h)return;const raw=new FormData(f);
  Promise.resolve(h(Object.fromEntries([...raw.entries()].filter(([k,v])=>typeof v==='string')),f,raw)).catch(err=>{toast('Error: '+err.message);const b=f.querySelector('[type=submit]');if(b)b.disabled=false});
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.matches)return;
  if(t.matches('[data-search]')){const q=t.value.trim().toLowerCase();$$('.view [data-s]').forEach(c=>c.classList.toggle('hide',!!q&&!c.dataset.s.includes(q)));return}
  if(t.closest('.pwrow')){const lab=t.closest('label'),m=lab&&lab.querySelector('.meter');if(m){const s=strength(t.value);m.dataset.s=s;m.firstElementChild.style.width=(s*25)+'%'}}
});
window.addEventListener('error',e=>toast('Error: '+e.message));

if(AppP){
  AppP.addListener('backButton',()=>{
    if($('.viewer')){closeViewer();return}
    if($('.modal')){closeModal();return}
    if(KEY&&tab!=='home'){acts.tab({dataset:{k:'home'}});return}
    AppP.exitApp();
  });
}
if(SB){try{SB.setStyle({style:'DARK'});SB.setBackgroundColor({color:'#0e0e12'})}catch(e){}}

const splashDone=new Promise(res=>{const el=document.getElementById('splash');let d=false;const end=()=>{if(d)return;d=true;el.classList.add('out');setTimeout(()=>{el.remove();res()},500)};setTimeout(end,4600);el.addEventListener('click',end)});
(async function boot(){
  if(!window.crypto||!crypto.subtle)return fatal('This browser does not support secure encryption here. Open the file in Chrome, or use the Android app.');
  try{DB=await openDB()}catch(e){return fatal('This browser is blocking private storage. Turn off private/incognito mode and try again.')}
  bioOn=!!(await kvGet('bio'));
  if(NATIVE){bioOK=await bioAvailable();if(!bioOK)bioOn=false}
  const meta=await kvGet('meta');await splashDone;meta?renderUnlock():renderSetup();
})();
</script>
